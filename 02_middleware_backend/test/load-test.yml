config:
  target: 'http://localhost:3000'
  phases:
    - duration: 15
      arrivalRate: 5
      name: "Warm up"
    - duration: 30
      arrivalRate: 5
      rampTo: 40
      name: "Ramp up load"
    - duration: 15
      arrivalRate: 40
      name: "Sustained peak load"
scenarios:
  - name: "Consultar pagos y simular reserva"
    flow:
      - get:
          url: "/api/payments/all"
      - post:
          url: "/api/reservas"
