; =========================================================
; Procesos de la pasarela BoA administrados por Supervisor
; =========================================================
[program:boa-cadena]
command=/usr/local/bin/boa-iniciar-cadena
directory=/opt/boa/01_blockchain_smart_contracts
user=root
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
priority=10
stdout_logfile=/var/log/boa/cadena.log
stdout_logfile_maxbytes=20MB
redirect_stderr=true

[program:boa-api]
command=/usr/bin/node server.js
directory=/opt/boa/02_middleware_backend
user=boa
environment=NODE_ENV="production"
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
priority=20
stdout_logfile=/var/log/boa/api.log
stdout_logfile_maxbytes=50MB
redirect_stderr=true
