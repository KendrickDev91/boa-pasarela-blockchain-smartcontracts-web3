# =========================================================
# Sitio público de la pasarela BoA (Apache2)
#   /        -> interfaz React compilada (dist)
#   /api/    -> servidor intermedio Node.js (127.0.0.1:3000)
#   /rpc     -> RPC público filtrado de la red de pruebas (vía el servidor intermedio)
#   /cacti   -> monitoreo (configuración propia del paquete cacti)
# =========================================================
LogFormat "%h %t \"%r\" %>s %b %D" boa_tiempos

<VirtualHost *:80>
    ServerName __DOMINIO__
    DocumentRoot /opt/boa/03_frontend_dapp/dist

    <Directory /opt/boa/03_frontend_dapp/dist>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Rutas de la SPA (React Router): cualquier ruta sin archivo sirve index.html
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    # Canal SSE de confirmación: sin búfer ni compresión
    SetEnvIf Request_URI "/stream$" no-gzip=1
    ProxyPass        /api/pagos/ http://127.0.0.1:3000/api/pagos/ flushpackets=on timeout=3600
    ProxyPassReverse /api/pagos/ http://127.0.0.1:3000/api/pagos/

    ProxyPass        /api/ http://127.0.0.1:3000/api/ timeout=60
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/
    ProxyPass        /rpc  http://127.0.0.1:3000/rpc timeout=60
    ProxyPassReverse /rpc  http://127.0.0.1:3000/rpc

    # El puerto del nodo (8545) y el de la API (3000) no se exponen: solo escuchan en 127.0.0.1
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog ${APACHE_LOG_DIR}/boa_error.log
    CustomLog ${APACHE_LOG_DIR}/boa_access.log combined
    # Registro con el tiempo de respuesta en microsegundos (%D) para las pruebas de rendimiento
    CustomLog ${APACHE_LOG_DIR}/boa_tiempos.log boa_tiempos
</VirtualHost>
